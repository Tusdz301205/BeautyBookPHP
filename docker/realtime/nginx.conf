events {}
http {
    include /etc/nginx/mime.types;
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    server {
        listen 80;
        server_name _;
        client_max_body_size 20m;
        root /var/www/html/public;
        # Keep every Laravel route intact; the local landing URL opens the source frontend.
        location = / {
            return 302 /beautybook;
        }
        location ~ ^/(?:beautybook-build|build|images|storage)/ {
            try_files $uri =404;
            access_log off;
        }
        location ~ ^/(?:beautybook-favicon\.svg|favicon\.ico|favicon\.svg|icons\.svg|robots\.txt)$ {
            try_files $uri =404;
            access_log off;
        }
        location /socket.io/ {
            proxy_pass http://realtime:3001;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 90s;
        }
        location / {
            proxy_pass http://app:8000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 180s;
        }
    }
}
